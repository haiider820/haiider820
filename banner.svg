<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050810"/>
      <stop offset="0.5" stop-color="#0A1128"/>
      <stop offset="1" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="neon" x1="60" y1="60" x2="640" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5D4"/>
      <stop offset="0.5" stop-color="#00B4FF"/>
      <stop offset="1" stop-color="#9D4EFF"/>
    </linearGradient>
    <linearGradient id="chip1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00F5D4"/>
      <stop offset="1" stop-color="#00B4FF"/>
    </linearGradient>
    <linearGradient id="chip2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9D4EFF"/>
      <stop offset="1" stop-color="#00B4FF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#7FE8FF" stroke-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .pulse { animation: pulseGlow 4s ease-in-out infinite; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      .blink { animation: blinkCursor 1s steps(1) infinite; }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .float { animation: floaty 5s ease-in-out infinite; }
      .float2 { animation: floaty 5s ease-in-out infinite 1.2s; }
      .float3 { animation: floaty 5s ease-in-out infinite 2.4s; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>

  <!-- glow blobs -->
  <circle class="pulse" cx="1000" cy="70" r="220" fill="#00F5D4" filter="url(#soft)"/>
  <circle class="pulse" cx="150" cy="330" r="200" fill="#9D4EFF" filter="url(#soft)"/>

  <!-- watermark title -->
  <text x="600" y="100" text-anchor="middle" fill="url(#neon)" fill-opacity="0.16" font-family="'Arial Black', Arial, sans-serif" font-size="130" font-weight="900" letter-spacing="6">HAIDER</text>

  <!-- eyebrow -->
  <text x="72" y="52" fill="#7FE8FF" font-family="'Courier New', monospace" font-size="14" letter-spacing="5">FLUTTER DEVELOPER // MOBILE x AI</text>

  <!-- terminal card -->
  <g filter="url(#cardShadow)">
    <rect x="72" y="86" width="560" height="216" rx="14" fill="#0B1120" stroke="url(#neon)" stroke-width="1.5"/>
    <!-- title bar -->
    <rect x="72" y="86" width="560" height="34" rx="14" fill="#111A30"/>
    <rect x="72" y="106" width="560" height="14" fill="#111A30"/>
    <circle cx="96" cy="103" r="5" fill="#FF5F57"/>
    <circle cx="114" cy="103" r="5" fill="#FEBC2E"/>
    <circle cx="132" cy="103" r="5" fill="#28C840"/>
    <text x="352" y="107" text-anchor="middle" fill="#5B6B8C" font-family="'Courier New', monospace" font-size="12">haider@dev — zsh</text>

    <!-- terminal body -->
    <text x="96" y="152" fill="#00F5D4" font-family="'Courier New', monospace" font-size="16">$ whoami</text>
    <text x="96" y="176" fill="#E8EEFC" font-family="'Courier New', monospace" font-size="16">&gt; Flutter developer, Wah Cantt, Pakistan</text>

    <text x="96" y="210" fill="#00F5D4" font-family="'Courier New', monospace" font-size="16">$ status</text>
    <text x="96" y="234" fill="#E8EEFC" font-family="'Courier New', monospace" font-size="16">&gt; shipping real-time trading + AI apps</text>

    <text x="96" y="268" fill="#00F5D4" font-family="'Courier New', monospace" font-size="16">$ focus --next</text>
    <text x="96" y="292" fill="#E8EEFC" font-family="'Courier New', monospace" font-size="16">&gt; on-device &amp; hybrid AI inference</text>
    <rect class="blink" x="470" y="280" width="10" height="16" fill="#00F5D4"/>
  </g>

  <!-- floating skill chips -->
  <g font-family="'Courier New', monospace" font-size="15" font-weight="700">
    <g class="float">
      <rect x="700" y="150" width="130" height="42" rx="21" fill="url(#chip1)" fill-opacity="0.15" stroke="url(#chip1)"/>
      <text x="765" y="177" text-anchor="middle" fill="#E8EEFC">Flutter</text>
    </g>
    <g class="float2">
      <rect x="850" y="110" width="130" height="42" rx="21" fill="url(#chip2)" fill-opacity="0.15" stroke="url(#chip2)"/>
      <text x="915" y="137" text-anchor="middle" fill="#E8EEFC">On-Device AI</text>
    </g>
    <g class="float3">
      <rect x="720" y="210" width="110" height="42" rx="21" fill="url(#chip1)" fill-opacity="0.15" stroke="url(#chip1)"/>
      <text x="775" y="237" text-anchor="middle" fill="#E8EEFC">FastAPI</text>
    </g>
    <g class="float">
      <rect x="860" y="260" width="150" height="42" rx="21" fill="url(#chip2)" fill-opacity="0.15" stroke="url(#chip2)"/>
      <text x="935" y="287" text-anchor="middle" fill="#E8EEFC">Binance WS</text>
    </g>
    <g class="float2">
      <rect x="1010" y="190" width="120" height="42" rx="21" fill="url(#chip1)" fill-opacity="0.15" stroke="url(#chip1)"/>
      <text x="1070" y="217" text-anchor="middle" fill="#E8EEFC">Firebase</text>
    </g>
  </g>

  <!-- bottom tag line -->
  <text x="72" y="332" fill="#5B6B8C" font-family="'Courier New', monospace" font-size="13" letter-spacing="3">BUILD WITH CURIOSITY · IMPROVE WITH CONSISTENCY · SHARE WHAT YOU LEARN</text>
  <text x="1128" y="332" text-anchor="end" fill="#5B6B8C" font-family="'Courier New', monospace" font-size="13" letter-spacing="2">EST. 2025</text>
</svg>
