<svg width="900" height="70" viewBox="0 0 900 70" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02040A"/>
      <stop offset="0.5" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>
    <linearGradient id="hot2" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF3D9A"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="900" height="70" rx="14"/>
    </clipPath>
    <style>
      .dot { animation: dotPulse 1.6s ease-in-out infinite; }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; r: 5; }
        50% { opacity: 0.4; r: 6.5; }
      }
      .scan { animation: scanMove 4s linear infinite; }
      @keyframes scanMove {
        0% { transform: translateX(-120px); }
        100% { transform: translateX(900px); }
      }
      .typewriter {
        font-family: 'Courier New', Consolas, Monaco, monospace;
        font-size: 18px;
        font-weight: 700;
        fill: #E8F6FF;
      }
      .type-mask {
        animation: reveal 6s steps(40, end) infinite;
      }
      @keyframes reveal {
        0%, 8% { clip-path: inset(0 100% 0 0); }
        75%, 92% { clip-path: inset(0 0% 0 0); }
        100% { clip-path: inset(0 100% 0 0); }
      }
      .cursor2 { animation: blink2 0.8s steps(1) infinite; }
      @keyframes blink2 {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .bars rect { animation: eq 1.4s ease-in-out infinite; transform-origin: bottom; }
      .bars rect:nth-child(2) { animation-delay: 0.2s; }
      .bars rect:nth-child(3) { animation-delay: 0.4s; }
      .bars rect:nth-child(4) { animation-delay: 0.1s; }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="70" fill="url(#fbg)"/>
    <rect x="0" y="0" width="900" height="70" fill="none" stroke="url(#hot2)" stroke-width="1.5" opacity="0.7"/>

    <!-- moving scan glow -->
    <rect class="scan" x="0" y="0" width="120" height="70" fill="#00E5FF" opacity="0.06"/>

    <!-- left status dot -->
    <circle class="dot" cx="34" cy="35" r="5" fill="#00FFC2"/>
    <text x="52" y="30" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#5B6B8C">STATUS</text>
    <text x="52" y="46" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#00FFC2">ONLINE</text>

    <!-- divider -->
    <rect x="132" y="14" width="1" height="42" fill="#1E2A45"/>

    <!-- typewriter message -->
    <g transform="translate(155,44)">
      <g class="type-mask">
        <text class="typewriter">Thanks for visiting — let's build something</text>
      </g>
      <rect class="cursor2" x="422" y="-18" width="3" height="20" fill="#FF3D9A"/>
    </g>

    <!-- right equalizer bars -->
    <g class="bars" transform="translate(830,20)">
      <rect x="0" y="20" width="5" height="10" fill="#00E5FF" rx="1"/>
      <rect x="9" y="10" width="5" height="20" fill="#FF3D9A" rx="1"/>
      <rect x="18" y="15" width="5" height="15" fill="#00FFC2" rx="1"/>
      <rect x="27" y="5" width="5" height="25" fill="#00E5FF" rx="1"/>
    </g>
  </g>
</svg>
